<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Android adaptive foreground: transparent, Motiv innerhalb der zentralen 66 % -->
  <defs>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.35" stop-color="#ffd700"/>
      <stop offset="0.75" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#ecdfc6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <clipPath id="glassClip">
      <path d="M356 262 L378 748 Q382 788 422 788 L602 788 Q642 788 646 748 L668 262 Z"/>
    </clipPath>
  </defs>

  <!-- Motiv-Aussenkante r=410 (Ring 404 + halbe Strichbreite 6).
       Safe Zone = 66 % von 1024 -> r=338. Faktor 0.78 ergibt r=320,
       also ~18px Luft, damit die runde Android-Maske den Ring nicht anschneidet. -->
  <g transform="translate(512 512) scale(0.78) translate(-512 -512)">
    <circle cx="512" cy="512" r="404" fill="none" stroke="url(#ring)" stroke-width="12" opacity="0.75"/>
    <circle cx="512" cy="512" r="362" fill="none" stroke="url(#ring)" stroke-width="34"/>

    <g clip-path="url(#glassClip)">
      <rect x="330" y="286" width="364" height="520" fill="url(#beer)"/>
      <rect x="330" y="740" width="364" height="66" fill="#92400e" opacity="0.35"/>
      <path d="M404 300 L424 726" fill="none" stroke="#fffdf5" stroke-width="30"
            stroke-linecap="round" opacity="0.28"/>
      <circle cx="556" cy="418" r="19" fill="#fff8dc" opacity="0.55"/>
      <circle cx="472" cy="512" r="14" fill="#fff8dc" opacity="0.45"/>
      <circle cx="576" cy="596" r="12" fill="#fff8dc" opacity="0.40"/>
      <circle cx="486" cy="672" r="16" fill="#fff8dc" opacity="0.40"/>
    </g>

    <path d="M356 262 L378 748 Q382 788 422 788 L602 788 Q642 788 646 748 L668 262 Z"
          fill="none" stroke="#ffd700" stroke-width="22" stroke-linejoin="round"/>

    <path d="M348 268 C346 212 394 186 434 208 C458 174 530 172 558 206
             C608 190 682 212 676 268 C676 302 618 320 512 320
             C406 320 348 302 348 268 Z"
          fill="url(#foam)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
